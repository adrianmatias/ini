# The project environment: one declaration here, one lock (`uv.lock`), every command via `uv run`.
# This is ini's own and the starter every copy begins from; the kickoff renames the project and
# points `[tool.ini]` at its package.

[project]
name = "ini"
version = "0.3.0"
description = "A live cookiecutter for AI agents: knowledge in the shape of a fresh repository"
readme = "README.md"
license = "MIT"
# 3.14 is the floor: deferred annotations, template strings, supported free-threading. Check the
# dependencies for wheels before moving to 3.15 (`wiki/learnings.md`).
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.14",
]

[dependency-groups]
# The gate toolchain `python -m ci gates` runs. ruff and ty are pinned exactly because their rule
# sets move between releases; the rest float on a floor.
dev = [
    "coverage>=7.17",
    "pylint>=4.1",
    "pytest>=9.2",
    "ruff==0.17.5",
    "ty==0.0.105",
    "vulture>=2.16",
]

[tool.uv]
# ini is not installed as a package: the harness runs from the tree (`python -m ci`). A copy's
# kickoff replaces this table with a build system for its own package.
package = false

[tool.ini]
# In ini the product is the harness itself; in a copy the kickoff sets `src = "src"`, the project's
# package, `tests = "tests"` and `scripts = ["ci"]`.
src = "."
package = "ci"
tests = "ci/tests"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# Editor feedback only; each gate passes its own rules (`uv run python -m ci gates --list`).
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["ci/tests"]
pythonpath = ["."]
addopts = "-q -p no:cacheprovider"

[tool.ty.environment]
python-version = "3.14"
